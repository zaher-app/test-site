<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thanks</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; line-height: 1.5; }
    td { padding: 4px 12px 4px 0; font-family: ui-monospace, monospace; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Thanks page</h1>
  <p>Parameters this page was opened with:</p>
  <table id="params"></table>
  <script>
    const table = document.getElementById("params");
    const params = [...new URLSearchParams(location.search)];
    if (params.length === 0) table.outerHTML = "<p>(none)</p>";
    for (const [key, value] of params) {
      const row = table.insertRow();
      row.insertCell().textContent = key;
      row.insertCell().textContent = value;
    }
  </script>
</body>
</html>
